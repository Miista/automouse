services:
  automouse:
    image: automouse:local
    container_name: automouse
    build: .
    # Dashboard is published on the host. It's protected by the built-in
    # admin login (first-launch setup) — so this is safe to expose directly.
    # If you'd rather front it with a reverse proxy (Caddy/Authelia) instead,
    # remove this ports block and reach it over the Docker network as
    # automouse:8765.
    #
    # If this container instead runs with network_mode: "service:<vpn>"
    # (sharing a VPN container's network namespace so its MAM traffic
    # egresses through a specific VPN/seedbox IP), Docker does not allow a
    # `ports:` block here at all — the mapping must live on that VPN
    # container's own service definition instead, and this block should be
    # removed.
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
    environment:
      # Recommended: pin the MAM session cookie via env var so it never
      # touches disk. The UI will show this field locked once set.
      # AUTOMOUSE_SETTING_MAM_ID: "your_mam_id_cookie_value"
      #
      # Only set this if you are intentionally running with no auth layer
      # at all (e.g. strictly loopback-bound, single-user host):
      # AUTOMOUSE_AUTH_DISABLED: "true"
    restart: unless-stopped
